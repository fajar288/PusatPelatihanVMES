name: CI

on:
  push:
    branches: [main]
  pull_request: # semua PR, termasuk PR bertumpuk yang base-nya bukan main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  text-guard:
    name: Teks (tanpa em dash / en dash)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Teks yang tampil ke pengguna memakai "-", ":", koma, atau "s.d.", bukan em dash (U+2014) / en dash (U+2013).
      # Pola ditulis sebagai byte UTF-8 agar berkas ini sendiri tidak memuat karakternya.
      - name: Tolak em dash / en dash di frontend/src, backend/app, backend/resources, seed data
        run: |
          pattern="$(printf '\xe2\x80\x94')\|$(printf '\xe2\x80\x93')"
          if grep -rn "$pattern" frontend/src backend/app backend/resources backend/database/seeders; then
            echo "::error::Ditemukan em dash / en dash. Ganti dengan '-', ':', koma, atau 's.d.' sesuai konteks."
            exit 1
          fi
          echo "Tidak ada em dash / en dash."

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://pusatpelatihan.id

  # Backend Laravel (1A) belum di-scaffold. Job ini otomatis aktif begitu backend/composer.json ada.
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend exists
        id: exists
        run: |
          if [ -f backend/composer.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "backend/ belum ada - job dilewati"; fi

      - name: Setup PHP
        if: steps.exists.outputs.yes == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, intl, zip, gd, exif
          coverage: none

      - name: Install Composer dependencies
        if: steps.exists.outputs.yes == 'true'
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (Pint)
        if: steps.exists.outputs.yes == 'true'
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Tests
        if: steps.exists.outputs.yes == 'true'
        working-directory: backend
        run: |
          cp -n .env.example .env || true
          php artisan key:generate --force
          php artisan test

  # Hosting produksi (cPanel) umumnya hanya menyediakan MySQL/MariaDB, pengembangan lokal memakai PostgreSQL, dan job
  # di atas memakai SQLite. Matrix ini menjalankan migrasi + seed dan seluruh tes di ketiga server database agar
  # migrasi, query, dan angka KPI tetap sama di semuanya.
  backend-db:
    name: Backend (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.0
            image: mysql:8.0
            connection: mysql
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - name: MariaDB 10.11
            image: mariadb:10.11
            connection: mariadb
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
          - name: PostgreSQL 16
            image: postgres:16
            connection: pgsql
            port: 5432
            health: pg_isready -U ppti -d ppti_test
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ppti_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ppti_test
          POSTGRES_USER: ppti
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ppti_test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: ppti_test
      DB_USERNAME: ${{ matrix.connection == 'pgsql' && 'ppti' || 'root' }}
      DB_PASSWORD: ${{ matrix.connection == 'pgsql' && 'secret' || 'root' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, pdo_pgsql, intl, zip, gd, exif
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Versi server database
        run: |
          cp -n .env.example .env || true
          php artisan key:generate --force
          php artisan db:show | head -12

      - name: Migrasi + seed dari kosong
        run: php artisan migrate:fresh --seed --force

      - name: Rollback seluruh migrasi lalu migrasi ulang
        run: |
          php artisan migrate:reset --force
          php artisan migrate --force

      - name: Tests
        run: php artisan test
