name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://pusatpelatihan.id

  # Backend Laravel (1A) belum di-scaffold. Job ini otomatis aktif begitu backend/composer.json ada.
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend exists
        id: exists
        run: |
          if [ -f backend/composer.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "backend/ belum ada — job dilewati"; fi

      - name: Setup PHP
        if: steps.exists.outputs.yes == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, intl, zip
          coverage: none

      - name: Install Composer dependencies
        if: steps.exists.outputs.yes == 'true'
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (Pint)
        if: steps.exists.outputs.yes == 'true'
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Tests
        if: steps.exists.outputs.yes == 'true'
        working-directory: backend
        run: |
          cp -n .env.example .env || true
          php artisan key:generate --force
          php artisan test
